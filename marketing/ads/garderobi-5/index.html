<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<style>
/* Layout follows the "DEM 5 Bedrooms" reel: full-bleed AI room photo fading into cream, product info below */
@font-face { font-family: 'DMSans'; src: url('assets/dmsans.ttf'); font-weight: 100 1000; }
:root { --cream:#F4EFE7; --walnut:#8B6F47; --charcoal:#2A2725; --muted:#6E655C; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--cream); font-family:'DMSans', sans-serif; }
.slide { position:absolute; inset:0; overflow:hidden; background:var(--cream); visibility:hidden; }
.photo { position:absolute; left:0; top:0; width:1080px; height:1380px; overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; transform-origin:50% 40%; }
.photo.catalog img { object-fit:contain; background:#fff; } /* fallback until the AI photo exists */
.fade { position:absolute; left:0; right:0; top:900px; height:500px; background:linear-gradient(rgba(244,239,231,0), var(--cream) 92%); }
.logo { position:absolute; left:56px; top:44px; width:250px; z-index:5; }
.info { position:absolute; left:76px; right:76px; top:1205px; }
.info .kind { color:var(--muted); font-size:34px; }
.info .name { margin-top:6px; color:var(--charcoal); font-size:104px; font-weight:500; letter-spacing:-2px; line-height:1.05; }
.info .price { margin-top:18px; color:var(--walnut); font-size:92px; font-weight:500; letter-spacing:-1px; line-height:1; }
.info .finish { margin-top:34px; color:var(--muted); font-size:34px; }
.info .url { margin-top:62px; color:var(--charcoal); font-size:34px; }
.hook { position:absolute; left:76px; top:200px; color:var(--charcoal); font-size:104px; font-weight:500; letter-spacing:-2px; line-height:1.06; z-index:4; }
.hook-veil { position:absolute; left:0; right:0; top:0; height:720px; background:linear-gradient(rgba(244,239,231,.92), rgba(244,239,231,0)); z-index:3; }

#outro .bgimg { position:absolute; inset:0 0 auto 0; height:1100px; overflow:hidden; opacity:.16; }
#outro .bgimg img { width:100%; height:100%; object-fit:cover; }
#outro .bgfade { position:absolute; left:0; right:0; top:500px; height:600px; background:linear-gradient(rgba(244,239,231,0), var(--cream)); }
#outro .t { position:absolute; left:76px; right:76px; color:var(--charcoal); }
#outro h2 { top:520px; font-size:100px; font-weight:500; letter-spacing:-2px; line-height:1.06; }
#outro .site { top:800px; color:var(--walnut); font-size:44px; }
#outro .f1 { top:1060px; } #outro .f2 { top:1240px; }
#outro .f b { display:block; font-size:42px; font-weight:500; }
#outro .f span { display:block; margin-top:8px; font-size:36px; color:var(--muted); }
#outro .cta { top:1520px; font-size:56px; font-weight:500; }
</style>
</head>
<body>
<div id="slides"></div>
<script src="data.js"></script>
<script>
const ITEMS = window.ITEMS, N = ITEMS.length;
const money = (v) => v.toLocaleString('bg-BG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/\s/g, ' ') + ' €';
const pic = (it) => it.ai ?? it.photo;
const root = document.getElementById('slides');

ITEMS.forEach((it, k) => {
  const s = document.createElement('div');
  s.className = 'slide'; s.id = 's' + k;
  s.innerHTML = `
    <div class="photo${it.ai ? '' : ' catalog'}"><img src="${pic(it)}"></div>
    <div class="fade"></div>
    <img class="logo" src="assets/logo-clean.png">
    ${k === 0 ? `<div class="hook-veil"></div><div class="hook">${N} гардероба.<br>Твоят стил.</div>` : ''}
    <div class="info">
      <div class="kind">Гардероб · ширина ${it.width} см</div>
      <div class="name">${it.name}</div>
      <div class="price">${money(it.price)}</div>
      <div class="finish">${it.finish[0].toUpperCase() + it.finish.slice(1)}</div>
      <div class="url">domexpertmebel.com</div>
    </div>`;
  root.appendChild(s);
});
const outro = document.createElement('div');
outro.className = 'slide'; outro.id = 'outro';
outro.innerHTML = `
  <div class="bgimg"><img src="${pic(ITEMS[N - 1])}"></div><div class="bgfade"></div>
  <img class="logo" src="assets/logo-clean.png">
  <h2 class="t">Открий твоя<br>гардероб.</h2>
  <div class="t site">domexpertmebel.com</div>
  <div class="t f f1"><b>Доставка в цяла България</b><span>Еконт / Спиди</span></div>
  <div class="t f f2"><b>Опция за монтаж</b><span>София и Благоевград</span></div>
  <div class="t cta">Разгледай всички модели ↗</div>`;
root.appendChild(outro);

// Cuts on beats of happy-beats vol-11 (114.8 BPM)
const CUT = [0, 3.70, 6.34, 8.96, 11.60, 14.22, 18.6];
const SW = 0.34;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, a, d) => ease((t - a) / d);
const $ = (s, r = document) => r.querySelector(s);
const rise = (el, t, a, d = 0.5, dy = 34) => { const p = prog(t, a, d); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
const slides = [...ITEMS.map((_, k) => $('#s' + k)), outro];

window.renderAt = function (t) {
  slides.forEach((s, i) => {
    const a = CUT[i], b = CUT[i + 1];
    const vis = t >= a - SW / 2 && t <= b + SW / 2;
    s.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) return;
    let x = 0;
    if (i > 0 && t < a + SW / 2) x = (1 - inOut((t - (a - SW / 2)) / SW)) * 1080;
    if (i < slides.length - 1 && t > b - SW / 2) x = -inOut((t - (b - SW / 2)) / SW) * 1080;
    s.style.transform = `translateX(${x}px)`;
  });

  ITEMS.forEach((it, k) => {
    const s = slides[k], lt = t - CUT[k];
    if (s.style.visibility === 'hidden') return;
    const span = CUT[k + 1] - CUT[k] + SW;
    $('.photo img', s).style.transform = `scale(${1.02 + 0.07 * clamp((lt + SW / 2) / span)})`; // slow push-in
    const start = k === 0 ? 1.55 : 0.12; // first slide opens with the hook title
    s.querySelectorAll('.info > div').forEach((r, j) => rise(r, lt, start + j * 0.08));
    if (k === 0) {
      const h = $('.hook', s), v = $('.hook-veil', s);
      const out = clamp((lt - 1.3) / 0.4);
      rise(h, lt, 0.1, 0.6, 40); h.style.opacity = prog(lt, 0.1, 0.6) * (1 - out);
      v.style.opacity = 1 - out;
    }
  });

  const ot = t - CUT[N];
  $('.bgimg img', outro).style.transform = `scale(${1.04 + 0.03 * clamp(ot / 4)})`;
  rise($('h2', outro), ot, 0.15, 0.6, 40);
  rise($('.site', outro), ot, 0.45);
  rise($('.f1', outro), ot, 0.8);
  rise($('.f2', outro), ot, 1.0);
  rise($('.cta', outro), ot, 1.35);
};
window.DURATION = CUT[CUT.length - 1];
</script>
</body>
</html>
