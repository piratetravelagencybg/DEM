# Downloads catalog photos for marketing ads (the Claude cloud sandbox can't reach www.mbx.bg).
name: Marketing images
on:
  push:
    branches: ['claude/**']
    paths: ['marketing/ads/*/build-data.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for d in marketing/ads/*/; do [ -f "$d/build-data.mjs" ] && (cd "$d" && node build-data.mjs); done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/ads
          git diff --cached --quiet || (git commit -m "Marketing: свалени снимки от каталога" && git push)
